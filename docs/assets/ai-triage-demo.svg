<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f5ff"/><stop offset="1" stop-color="#f3fbfa"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#1e315b" flood-opacity=".09"/></filter></defs><rect width="1440" height="920" fill="url(#bg)"/><rect width="1440" height="82" fill="#1b2348"/><rect x="40" y="22" width="40" height="40" rx="13" fill="#7967ed"/><path d="M51 45l8-12 7 8 6-5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="48" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Triagem Inteligente</text><rect x="1103" y="24" width="288" height="34" rx="17" fill="#303962"/><circle cx="1123" cy="41" r="5" fill="#66d9b1"/><text x="1138" y="46" fill="#e3e8fa" font-family="Arial,sans-serif" font-size="12">DEMO • SAÍDA ILUSTRATIVA • DADOS FICTÍCIOS</text>
<text x="74" y="157" fill="#1c2948" font-family="Arial,sans-serif" font-size="30" font-weight="700">Transforme descrições em próximos passos</text><text x="74" y="188" fill="#75819b" font-family="Arial,sans-serif" font-size="15">A IA sugere uma triagem; a equipe revisa antes de registrar ou responder.</text>
<rect x="74" y="226" width="610" height="580" rx="20" fill="#fff" filter="url(#s)"/><text x="108" y="271" fill="#273657" font-family="Arial,sans-serif" font-size="18" font-weight="700">Descrição do chamado</text><text x="108" y="299" fill="#8b95a9" font-family="Arial,sans-serif" font-size="13">Use um exemplo fictício para gerar uma sugestão.</text><rect x="108" y="327" width="542" height="211" rx="12" fill="#fafbfe" stroke="#e1e5ef"/><text x="132" y="365" fill="#495875" font-family="Arial,sans-serif" font-size="14">Desde a atualização de ontem, não consigo</text><text x="132" y="390" fill="#495875" font-family="Arial,sans-serif" font-size="14">acessar a pasta compartilhada da equipe pelo</text><text x="132" y="415" fill="#495875" font-family="Arial,sans-serif" font-size="14">VPN. O sistema mostra “acesso negado”.</text><text x="132" y="440" fill="#495875" font-family="Arial,sans-serif" font-size="14">Consigo entrar em outros sistemas normalmente.</text><text x="132" y="510" fill="#a2abbb" font-family="Arial,sans-serif" font-size="11">EXEMPLO FICTÍCIO · 186 / 2.000 caracteres</text><text x="108" y="581" fill="#273657" font-family="Arial,sans-serif" font-size="14" font-weight="700">Contexto opcional</text><rect x="108" y="599" width="542" height="44" rx="9" fill="#fff" stroke="#e1e5ef"/><text x="128" y="627" fill="#a2abbb" font-family="Arial,sans-serif" font-size="13">Equipe, sistema ou política relevante...</text><rect x="108" y="672" width="542" height="52" rx="11" fill="#6b5fe4"/><text x="261" y="704" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">✦ Gerar sugestão de triagem</text><text x="108" y="758" fill="#929cb0" font-family="Arial,sans-serif" font-size="12">A sugestão é revisada por uma pessoa antes de qualquer ação.</text>
<rect x="718" y="226" width="648" height="580" rx="20" fill="#fff" filter="url(#s)"/><rect x="753" y="254" width="150" height="28" rx="14" fill="#f0efff"/><text x="770" y="273" fill="#6b5fe4" font-family="Arial,sans-serif" font-size="11" font-weight="700">SUGESTÃO GERADA</text><text x="753" y="322" fill="#263553" font-family="Arial,sans-serif" font-size="21" font-weight="700">Resumo para revisão</text><rect x="753" y="347" width="578" height="82" rx="12" fill="#f7f8fc"/><text x="777" y="377" fill="#66748d" font-family="Arial,sans-serif" font-size="13">O usuário não acessa uma pasta compartilhada via VPN</text><text x="777" y="400" fill="#66748d" font-family="Arial,sans-serif" font-size="13">após uma atualização, mas outros sistemas funcionam.</text><text x="753" y="469" fill="#8793a7" font-family="Arial,sans-serif" font-size="11" font-weight="700">CATEGORIA SUGERIDA</text><rect x="753" y="482" width="160" height="35" rx="17" fill="#edf3ff"/><text x="772" y="505" fill="#4265c3" font-family="Arial,sans-serif" font-size="13" font-weight="700">Acesso e VPN</text><text x="953" y="469" fill="#8793a7" font-family="Arial,sans-serif" font-size="11" font-weight="700">PRIORIDADE</text><rect x="953" y="482" width="110" height="35" rx="17" fill="#fff5e6"/><text x="978" y="505" fill="#b27b1d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Alta</text><text x="1100" y="469" fill="#8793a7" font-family="Arial,sans-serif" font-size="11" font-weight="700">CONFIANÇA</text><text x="1100" y="503" fill="#2b9873" font-family="Arial,sans-serif" font-size="20" font-weight="700">0,87</text><text x="753" y="555" fill="#8793a7" font-family="Arial,sans-serif" font-size="11" font-weight="700">RESPOSTA INICIAL SUGERIDA</text><rect x="753" y="569" width="578" height="92" rx="12" fill="#f7f8fc"/><text x="777" y="599" fill="#66748d" font-family="Arial,sans-serif" font-size="13">Olá! Vou verificar as permissões da pasta e o acesso pela</text><text x="777" y="622" fill="#66748d" font-family="Arial,sans-serif" font-size="13">VPN. Você pode informar o nome da pasta e se outros</text><text x="777" y="645" fill="#66748d" font-family="Arial,sans-serif" font-size="13">colegas da equipe também foram afetados?</text><text x="753" y="698" fill="#8793a7" font-family="Arial,sans-serif" font-size="11" font-weight="700">INFORMAÇÕES QUE FALTAM</text><rect x="753" y="712" width="185" height="31" rx="15" fill="#f4f1ff"/><text x="771" y="732" fill="#7468c6" font-family="Arial,sans-serif" font-size="11">Nome da pasta</text><rect x="950" y="712" width="221" height="31" rx="15" fill="#f4f1ff"/><text x="969" y="732" fill="#7468c6" font-family="Arial,sans-serif" font-size="11">Outros usuários afetados?</text><text x="74" y="891" fill="#929cb0" font-family="Arial,sans-serif" font-size="11">Tela ilustrativa do protótipo de triagem • IA sugere; pessoa revisa • Conteúdo fictício</text></svg>
