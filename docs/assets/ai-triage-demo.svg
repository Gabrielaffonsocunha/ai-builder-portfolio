<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#111" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f0eef7"/><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f0eef7"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#28233a"/><circle cx="42" cy="36" r="18" fill="#d9f276"/><text x="36" y="42" fill="#29243b" font-family="Arial, sans-serif" font-size="17" font-weight="700">✦</text><text x="73" y="39" fill="#fbf8ff" font-family="Arial, sans-serif" font-size="19" font-weight="700">signal / AI</text><text x="73" y="56" fill="#aaa2c4" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">LABORATÓRIO DE TRIAGEM</text><text x="914" y="43" fill="#e1dceb" font-family="Arial, sans-serif" font-size="12" font-weight="700">Área de testes</text><text x="1015" y="43" fill="#aaa2c4" font-family="Arial, sans-serif" font-size="12" font-weight="400">Avaliações</text><text x="1118" y="43" fill="#aaa2c4" font-family="Arial, sans-serif" font-size="12" font-weight="400">Biblioteca de prompts</text><rect x="1261" y="20" width="148" height="32" rx="16" fill="#39334d"/><circle cx="1279" cy="36" r="4" fill="#d9f276"/><text x="1292" y="40" fill="#e1dceb" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing=".7">MODO DE TESTE</text><text x="68" y="125" fill="#77708f" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">AI BUILDER / TRIAGEM DE SUPORTE</text><text x="68" y="170" fill="#302a43" font-family="Arial, sans-serif" font-size="31" font-weight="700">Triagem de uma solicitação</text><text x="68" y="197" fill="#79738c" font-family="Arial, sans-serif" font-size="13" font-weight="400">Análise inicial do chamado, com uma etapa de revisão humana.</text><rect x="68" y="229" width="819" height="584" rx="18" fill="#fff" stroke="#e5e0ee" stroke-width="1"/><text x="98" y="270" fill="#9189a5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">MENSAGEM RECEBIDA</text><rect x="98" y="291" width="758" height="104" rx="12" fill="#f8f6fb"/><circle cx="124" cy="322" r="15" fill="#e3dff0"/><text x="119" y="327" fill="#51476d" font-family="Arial, sans-serif" font-size="11" font-weight="700">M</text><text x="153" y="321" fill="#423b53" font-family="Arial, sans-serif" font-size="12" font-weight="700">Marina · Cliente</text><text x="153" y="344" fill="#615b70" font-family="Arial, sans-serif" font-size="12" font-weight="400">“Não consigo acessar o painel desde hoje cedo. Já redefini minha senha,</text><text x="153" y="364" fill="#615b70" font-family="Arial, sans-serif" font-size="12" font-weight="400">mas aparece uma tela em branco depois do login. Preciso fechar o caixa.”</text><text x="98" y="435" fill="#9189a5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">RESPOSTA DO MODELO</text><rect x="98" y="455" width="758" height="149" rx="12" fill="#f5f3f9"/><circle cx="124" cy="485" r="15" fill="#d9f276"/><text x="118" y="490" fill="#302a43" font-family="Arial, sans-serif" font-size="12" font-weight="700">✦</text><text x="153" y="484" fill="#423b53" font-family="Arial, sans-serif" font-size="12" font-weight="700">Assistente de triagem</text><rect x="741" y="468" width="92" height="23" rx="12" fill="#e8e3f0"/><text x="754" y="484" fill="#615779" font-family="Arial, sans-serif" font-size="9" font-weight="700">PRÉVIA</text><text x="153" y="519" fill="#9690a5" font-family="Arial, sans-serif" font-size="10" font-weight="700">Resumo</text><text x="153" y="541" fill="#504a61" font-family="Arial, sans-serif" font-size="12" font-weight="400">Falha de acesso ao painel após autenticação; usuária precisa concluir</text><text x="153" y="560" fill="#504a61" font-family="Arial, sans-serif" font-size="12" font-weight="400">o fechamento de caixa hoje.</text><text x="153" y="585" fill="#8057a7" font-family="Arial, sans-serif" font-size="11" font-weight="700">Classificação sugerida: incidente · prioridade alta</text><text x="98" y="640" fill="#9189a5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">PERGUNTA DE ACOMPANHAMENTO</text><rect x="98" y="660" width="758" height="54" rx="10" fill="#fff" stroke="#e3deeb" stroke-width="1"/><text x="118" y="693" fill="#aaa4b6" font-family="Arial, sans-serif" font-size="12" font-weight="400">Pergunte qual navegador e dispositivo estão sendo usados…</text><rect x="98" y="741" width="148" height="42" rx="9" fill="#302a43"/><text x="121" y="767" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Analisar chamado  →</text><text x="266" y="767" fill="#8b8499" font-family="Arial, sans-serif" font-size="10" font-weight="400">A resposta é uma sugestão; revise antes de usar.</text><rect x="913" y="229" width="459" height="584" rx="18" fill="#302a43"/><text x="945" y="270" fill="#aaa2c4" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ENCAMINHAMENTO SUGERIDO</text><text x="945" y="307" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Suporte a aplicações</text><rect x="945" y="326" width="104" height="28" rx="14" fill="#554365"/><text x="960" y="345" fill="#f5d79b" font-family="Arial, sans-serif" font-size="10" font-weight="700">P2 · ALTA</text><line x1="945" y1="376" x2="1340" y2="376" stroke="#514a61" stroke-width="1"/><text x="945" y="410" fill="#aaa2c4" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">INDÍCIOS DA ANÁLISE</text><circle cx="956" cy="440" r="5" fill="#d9f276"/><text x="973" y="444" fill="#f5f1fc" font-family="Arial, sans-serif" font-size="12" font-weight="700">Falha de acesso</text><text x="973" y="463" fill="#b2abc3" font-family="Arial, sans-serif" font-size="10" font-weight="400">Ocorre após a autenticação</text><line x1="945" y1="478" x2="1340" y2="478" stroke="#514a61" stroke-width="1"/><circle cx="956" cy="505" r="5" fill="#f0bd76"/><text x="973" y="509" fill="#f5f1fc" font-family="Arial, sans-serif" font-size="12" font-weight="700">Impacto no negócio</text><text x="973" y="528" fill="#b2abc3" font-family="Arial, sans-serif" font-size="10" font-weight="400">Fechamento diário do caixa</text><line x1="945" y1="543" x2="1340" y2="543" stroke="#514a61" stroke-width="1"/><circle cx="956" cy="570" r="5" fill="#c6a5f4"/><text x="973" y="574" fill="#f5f1fc" font-family="Arial, sans-serif" font-size="12" font-weight="700">Alternativa tentada</text><text x="973" y="593" fill="#b2abc3" font-family="Arial, sans-serif" font-size="10" font-weight="400">Redefinir a senha não resolveu</text><line x1="945" y1="608" x2="1340" y2="608" stroke="#514a61" stroke-width="1"/><text x="945" y="665" fill="#aaa2c4" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">REVISÃO HUMANA</text><rect x="945" y="683" width="185" height="43" rx="9" fill="#d9f276"/><text x="969" y="710" fill="#302a43" font-family="Arial, sans-serif" font-size="11" font-weight="700">Aceitar sugestão</text><rect x="1142" y="683" width="198" height="43" rx="9" fill="#3b354d" stroke="#625a72" stroke-width="1"/><text x="1161" y="710" fill="#eee9f5" font-family="Arial, sans-serif" font-size="11" font-weight="700">Editar classificação</text><text x="945" y="764" fill="#aaa2c4" font-family="Arial, sans-serif" font-size="10" font-weight="400">Resultado ilustrativo · solicitação fictícia</text></svg>

