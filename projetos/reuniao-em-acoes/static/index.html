<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Protótipo de IA para transformar anotações de reunião em ações.">
  <title>Reunião em Ações</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1120;--panel:#121b2d;--line:#27344b;--text:#edf3ff;--muted:#a9b7ce;--accent:#70d6c0}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#18314a,var(--bg) 48%);color:var(--text);font:16px/1.5 system-ui,sans-serif}
    main{max-width:1000px;margin:0 auto;padding:48px 20px}header{margin-bottom:28px}.tag{color:var(--accent);font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
    h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;margin:.6rem 0}p{color:var(--muted)}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}
    section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}label{display:block;margin:14px 0 6px;font-weight:650}
    textarea{width:100%;min-height:300px;border:1px solid var(--line);border-radius:9px;background:#0b1322;color:var(--text);padding:12px;font:inherit;resize:vertical}
    button{margin-top:16px;border:0;border-radius:9px;background:var(--accent);color:#08201d;padding:12px 17px;font:inherit;font-weight:750;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.notice{font-size:.88rem;border-left:3px solid #e8b769;padding-left:12px}.result{min-height:330px}
    .card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:#0d1625}.card h3{margin:0 0 6px;font-size:1rem}
    .meta{font-size:.88rem;color:var(--muted)}.error{color:#ff9a9a}ul{padding-left:22px;color:var(--muted)}
    @media(max-width:760px){.grid{grid-template-columns:1fr}main{padding-top:30px}}
  </style>
</head>
<body>
<main>
  <header><div class="tag">AI Builder · produtividade</div><h1>Reunião em Ações</h1>
    <p>Transforme anotações soltas em um resumo e próximos passos claros.</p></header>
  <div class="grid">
    <section>
      <h2>Anotações</h2>
      <form id="form">
        <label for="notes">Cole anotações fictícias</label>
        <textarea id="notes" required minlength="20" maxlength="12000">Marina vai enviar a primeira versão do painel até sexta-feira. O time vai revisar na próxima reunião. Ainda precisamos decidir quem fará a documentação. João ficou de validar os números antes da revisão.</textarea>
        <button id="submit" type="submit">Organizar com IA</button>
      </form>
      <p class="notice">Use dados fictícios. Confira o resultado com os participantes antes de tratar como ata oficial.</p>
    </section>
    <section class="result"><h2>Resultado</h2><div id="output" aria-live="polite"><p>Envie as anotações para gerar a estrutura.</p></div></section>
  </div>
</main>
<script>
const form=document.querySelector("#form"), output=document.querySelector("#output"), button=document.querySelector("#submit");
function heading(text){const el=document.createElement("h3");el.textContent=text;return el}
function list(values){const ul=document.createElement("ul");for(const value of values||[]){const li=document.createElement("li");li.textContent=value;ul.append(li)}return ul}
form.addEventListener("submit",async event=>{
  event.preventDefault();button.disabled=true;button.textContent="Organizando…";output.replaceChildren();
  try{
    const response=await fetch("/api/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({notes:document.querySelector("#notes").value})});
    const data=await response.json();if(!response.ok)throw new Error(data.detail||"Falha ao organizar as anotações.");
    const summary=document.createElement("p");summary.textContent=data.summary;output.append(heading("Resumo"),summary,heading("Decisões"),list(data.decisions));
    output.append(heading("Ações"));
    if(!(data.actions||[]).length){const empty=document.createElement("p");empty.textContent="Nenhuma ação identificada.";output.append(empty)}
    for(const action of data.actions||[]){const card=document.createElement("article");card.className="card";card.append(heading(action.title));const meta=document.createElement("p");meta.className="meta";meta.textContent="Responsável: "+action.responsible+" · Prazo: "+action.deadline+" · Prioridade: "+action.priority;card.append(meta);output.append(card)}
    output.append(heading("Perguntas em aberto"),list(data.open_questions));
  }catch(error){const message=document.createElement("p");message.className="error";message.textContent=error.message;output.append(message)}
  finally{button.disabled=false;button.textContent="Organizar com IA"}
});
</script>
</body>
</html>
